name: Release

# 发布 Release 时自动构建客户端/服务端并生成安装包；
# 也可在 Actions 页面手动运行（workflow_dispatch）做预发布验证。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

env:
  # aly 自动更新器版本（aly 仓库的 release tag，见 aly/client 目录）
  ALY_CLIENT_VERSION: "0.1.3"

jobs:
  build:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # 通过环境变量传递（而不是直接插值进脚本），避免 tag/输入被当作 PowerShell 代码执行
          $tag = if ($env:EVENT_NAME -eq "release") { $env:RELEASE_TAG } else { $env:INPUT_VERSION }
          $tag = ($tag ?? "").Trim()
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          # 只接受 x.y.z 数字前缀，后续步骤插入脚本时不会有注入面
          $m = [regex]::Match($tag, '^\d+\.\d+\.\d+')
          $v = if ($m.Success) { $m.Value } else { "0.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version=$v Tag=v$v"

      # ---------------- 客户端（自包含，免装 .NET 运行时） ----------------
      - name: Build client (net8, self-contained win-x64)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          dotnet publish src/EasyRDP.Client.Wpf/EasyRDP.Client.Wpf.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$v -p:InformationalVersion=$tag `
            -p:AlyClientVersion=$env:ALY_CLIENT_VERSION `
            -p:AlyUpdateFolder="$PWD/stage/client/UpdateFolder/" `
            -o stage/client/ApplicationFolder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------- 服务端（net40，Windows XP+） ----------------
      - name: Build server (net40)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          dotnet build src/EasyRDP.Server.Wpf/EasyRDP.Server.Wpf.csproj `
            -c Release `
            -p:Version=$v -p:InformationalVersion=$tag `
            -p:AlyClientVersion=$env:ALY_CLIENT_VERSION `
            -p:AlyUpdateFolder="$PWD/stage/server/UpdateFolder/" `
            -o stage/server/ApplicationFolder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare staged files
        shell: pwsh
        run: |
          $alyUrl = "https://github.com/lishuangquan1987/aly/releases/download/v$env:ALY_CLIENT_VERSION/aly-client.exe"
          foreach ($app in @("client", "server")) {
            New-Item -ItemType Directory -Force -Path "stage/$app/UpdateFolder" | Out-Null
            # aly 更新器所需的 manifest（指向 ApplicationFolder 下的主程序）
            Copy-Item "installer/update-$app.json" "stage/$app/UpdateFolder/client.json" -Force
            # aly-client.exe 通过 ProjectReference 引用 SDK 时不会自动导入 build targets，这里显式下载；
            # 失败只警告：更新器是可选组件，不阻断发布
            try {
              Invoke-WebRequest -Uri $alyUrl -OutFile "stage/$app/UpdateFolder/aly-client.exe" -UseBasicParsing
              Write-Host "Downloaded aly-client.exe ($env:ALY_CLIENT_VERSION) for $app"
            } catch {
              Write-Warning "aly-client.exe download failed for ${app}: $($_.Exception.Message)"
            }
          }

          $required = @(
            "stage/client/ApplicationFolder/EasyRDP.Client.Wpf.exe",
            "stage/server/ApplicationFolder/EasyRDP.Server.Wpf.exe",
            "stage/server/ApplicationFolder/openh264/x86/openh264.dll",
            "stage/client/ApplicationFolder/openh264/x64/openh264.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing build output: $($missing -join ', ')"
            exit 1
          }
          if (-not (Test-Path "stage/server/UpdateFolder/aly-client.exe")) {
            Write-Warning "aly-client.exe 未下载成功：安装包将不含自动更新器（主功能不受影响）"
          }
          Get-ChildItem stage -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("Staged {0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB)) }

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build installers
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($app in @("client", "server")) {
            & $iscc "/DMyAppVersion=$v" "/DSourceDir=$PWD/stage/$app" "/DOutputDir=$PWD/dist" "installer/$app.iss"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build portable zip (server, Windows XP compatible)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "stage/server/*" -DestinationPath "dist/EasyRDP-Server-$v-portable.zip" -CompressionLevel Optimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyRDP-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
